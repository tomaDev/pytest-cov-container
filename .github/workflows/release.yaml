name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# One release at a time; never cancel a run that may be mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: pytest-cov-container
  OWNER: tomaDev

jobs:
  check_pypi:
    name: check PyPI version
    runs-on: ubuntu-26.04
    outputs:
      PYPI_VERSION: ${{ steps.get.outputs.PYPI_VERSION }}
    steps:
      - name: Fetch information from PyPI
        id: get
        run: |
          # .info.version is PyPI's latest release; empty when the project
          # does not exist yet (curl -f fails on the 404).
          version=$(curl -sf "https://pypi.org/pypi/$PACKAGE_NAME/json" | jq -r '.info.version // empty')
          if [ -z "$version" ]; then
            echo "Package not found on PyPI."
            version="0.0.0"
          fi
          echo "Latest version on PyPI: $version"
          echo "PYPI_VERSION=$version" >> "$GITHUB_OUTPUT"

  # Nothing is built or published until both suites pass on Linux.
  tests:
    permissions:
      contents: read # checkout
    uses: $/.github/workflows/tests.yaml

  setup_and_build:
    needs: [check_pypi, tests]
    name: project setup and build
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout
    outputs:
      NEW_VERSION: ${{ steps.get.outputs.NEW_VERSION }}
    steps:
      - name: Get the new project version
        id: get
        run: echo "NEW_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Compare versions and exit if not newer
        env:
          PYPI_VERSION: ${{ needs.check_pypi.outputs.PYPI_VERSION }}
          NEW_VERSION: ${{ steps.get.outputs.NEW_VERSION }}
        run: |
          echo "New release version - $NEW_VERSION"
          echo "latest PyPI version - $PYPI_VERSION"
          if [ "$NEW_VERSION" == "$PYPI_VERSION" ]; then
            echo "same version. No need to release"
            exit 1
          elif [ "$(printf '%s\n' "$PYPI_VERSION" "$NEW_VERSION" | sort -rbV | head -n 1)" != "$NEW_VERSION" ]; then
            echo "The new version $NEW_VERSION is not greater than the latest version $PYPI_VERSION on PyPI"
            exit 1
          else
            echo "The new version $NEW_VERSION is greater than the latest version $PYPI_VERSION on PyPI"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache in the job that builds what gets published: a poisoned
          # cache entry would end up on PyPI.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Validate package version matches tag version
        env:
          TAG_VERSION: ${{ steps.get.outputs.NEW_VERSION }}
        run: |
          # Run __about__.py directly: importing it via the package runs
          # __init__.py, which needs the (not yet installed) package itself.
          PACKAGE_VERSION="$(python -c 'import runpy;print(runpy.run_path("src/pytest_cov_container/__about__.py")["__version__"])')"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch: (package internal) $PACKAGE_VERSION != $TAG_VERSION (tag)"
              exit 1
          fi

      - name: Install the project
        run: uv sync --all-extras --frozen --no-editable

      - name: Build the project
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github_release:
    name: Create GitHub Release
    needs: [setup_and_build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # gh release create
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.setup_and_build.outputs.NEW_VERSION }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes

  pypi_publish:
    name: Upload release to PyPI
    needs: [setup_and_build]
    runs-on: ubuntu-26.04
    environment:
      name: release
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
