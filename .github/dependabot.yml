# Patch and minor updates arrive as one PR per ecosystem and merge on their
# own once CI passes (dependabot-automerge.yaml); majors come one per PR.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
