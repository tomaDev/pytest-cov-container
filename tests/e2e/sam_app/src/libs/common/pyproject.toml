# A local package the uv function depends on through a `path` source. Its
# code sits under a module root, so it lands in the build as common/.
[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"
module-name = "common"
